<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form class="container">
        <div class="values">
            <input type="text" id="result" class="" readonly placeholder="0"/>
            <input type="text" id="disable" class="" readonly placeholder="Off"/>
        </div>
        <div class="btns-value">
            <div class="btns-disabled">
                <button type="button" class="btn" onclick="off()">OFF</button>
                <button type="reset" class="btn" onclick="on()">ON/C</button>
            </div>
            <div class="btns">
                <button type="button" class="btn delete-btn" onclick="del()">DEL</button>
                <button type="button" class="btn operateur" onclick="operateur('%')">MOD</button>
                <button type="button" class="btn operateur" onclick="operateur('**')">^</button>
                <button type="button" class="btn operateur" onclick="operateur('/')">/</button>
            </div>
            <div class="btns">
                <button type="button" class="btn additionneur" onclick="additionneur('7')">7</button>
                <button type="button" class="btn additionneur" onclick="additionneur('8')">8</button>
                <button type="button" class="btn additionneur" onclick="additionneur('9')">9</button>
                <button type="button" class="btn operateur" onclick="operateur('*')">*</button>
            </div>
            <div class="btns">
                <button type="button" class="btn additionneur" onclick="additionneur('4')">4</button>
                <button type="button" class="btn additionneur" onclick="additionneur('5')">5</button>
                <button type="button" class="btn additionneur" onclick="additionneur('6')">6</button>
                <button type="button" class="btn operateur" onclick="operateur('-')">-</button>
            </div>
            <div class="btns">
                <button type="button" class="btn additionneur" onclick="additionneur('1')">1</button>
                <button type="button" class="btn additionneur" onclick="additionneur('2')">2</button>
                <button type="button" class="btn additionneur" onclick="additionneur('3')">3</button>
                <button type="button" class="btn operateur" onclick="operateur('+')">+</button>
            </div>
            <div class="btns">
                <button type="button" class="btn additionneur" onclick="additionneur('0')">0</button>
                <button type="button" class="btn additionneur" onclick="additionneur('.')">.</button>
                <button type="button" class="btn additionneur" onclick="additionneur('00')">00</button>
                <button type="button" class="btn eval" onclick="egal()">=</button>
            </div>
        </div>
    </form>

    <script src="script.js"></script>
</body>
</html>
