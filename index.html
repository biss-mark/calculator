<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
</head>
<body>

    <div class="container">
        <div class="calculator">
            <div class="ecran">
                <div class="ligne ligne-1 result"></div>
                <div class="ligne ligne-2 operation"></div>
            </div>
            <div class="clavier">
                <div class="ligne ligne-3">
                    <span class="btn action" >AC</span>
                </div>
                <div class="ligne ligne-3">
                    <span class="btn action" ><iconify-icon icon="material-symbols:cancel" style="font-size: 30px;"></iconify-icon></span>
                    <span class="btn action">()</span>
                    <span class="btn action">%</span>
                    <span class="btn operator">/</span>
                </div>
                <div class="ligne ligne-4">
                    <span class="btn chiffre">7</span>
                    <span class="btn chiffre">8</span>
                    <span class="btn chiffre">9</span>
                    <span class="btn operator">*</span>
                </div>
                <div class="ligne ligne-5">
                    <span class="btn chiffre">4</span>
                    <span class="btn chiffre">5</span>
                    <span class="btn chiffre">6</span>
                    <span class="btn operator">-</span>
                </div>
                <div class="ligne ligne-6">
                    <span class="btn chiffre">1</span>
                    <span class="btn chiffre">2</span>
                    <span class="btn chiffre">3</span>
                    <span class="btn operator">+</span>
                </div>
                <div class="ligne ligne-7">
                    <span class="btn action">+/-</span>
                    <span class="btn chiffre">0</span>
                    <span class="btn coma">.</span>
                    <span class="btn operator">=</span>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
