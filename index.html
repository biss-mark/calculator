<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form class="container">
        <div class="values">
            <input type="text" id="result" class="" readonly placeholder="0"/>
            <input type="text" id="disable" class="" readonly placeholder="Off"/>
        </div>
        <div class="btns-value">
            <div class="btns-disabled">
                <button type="button" class="btn" onclick="off()">OFF</button>
                <button type="reset" class="btn" onclick="on()">ON/C</button>
            </div>
            <div class="btns">
                <button type="button" class="btn delete-btn" onclick="del()">DEL</button>
                <button type="button" class="btn operateur" onclick="operator('%')">MOD</button>
                <button type="button" class="btn operateur" onclick="operator('**')">^</button>
                <button type="button" class="btn operateur" onclick="operator('/')">/</button>
            </div>
            <div class="btns">
                <button type="button" class="btn additionneur" onclick="number('7')">7</button>
                <button type="button" class="btn additionneur" onclick="number('8')">8</button>
                <button type="button" class="btn additionneur" onclick="number('9')">9</button>
                <button type="button" class="btn operateur" onclick="operator('*')">*</button>
            </div>
            <div class="btns">
                <button type="button" class="btn additionneur" onclick="number('4')">4</button>
                <button type="button" class="btn additionneur" onclick="number('5')">5</button>
                <button type="button" class="btn additionneur" onclick="number('6')">6</button>
                <button type="button" class="btn operateur" onclick="operator('-')">-</button>
            </div>
            <div class="btns">
                <button type="button" class="btn additionneur" onclick="number('1')">1</button>
                <button type="button" class="btn additionneur" onclick="number('2')">2</button>
                <button type="button" class="btn additionneur" onclick="number('3')">3</button>
                <button type="button" class="btn operateur" onclick="operator('+')">+</button>
            </div>
            <div class="btns">
                <button type="button" class="btn additionneur" onclick="number('0')">0</button>
                <button type="button" class="btn additionneur" onclick="number('.')">.</button>
                <button type="button" class="btn additionneur" onclick="number('00')">00</button>
                <button type="button" class="btn eval" onclick="egal()">=</button>
            </div>
        </div>
    </form>

    <script src="script.js"></script>
</body>
</html>
